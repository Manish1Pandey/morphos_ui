name: morphos_ui
description: >-
  Animate thousands of Flutter UI items on one spring-driven surface: a single
  render object with spring physics, viewport culling and 100k-node scaling.
version: 0.1.1
homepage: https://flutterdev.in/packages/morphos_ui/
repository: https://github.com/Manish1Pandey/morphos_ui
issue_tracker: https://github.com/Manish1Pandey/morphos_ui/issues
topics:
  - rendering
  - animation
  - layout
  - physics
  - performance

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: any

flutter:
  shaders:
    - shaders/morph_sheen.frag
