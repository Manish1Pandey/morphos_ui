name: morphos_ui
description: >-
  A flat, matrix-driven UI field for Flutter: many nodes laid out by one affine
  transform, animated by a built-in spring solver and painted with drawVertices.
version: 0.1.0
repository: https://github.com/Manish1Pandey/morphos_ui
issue_tracker: https://github.com/Manish1Pandey/morphos_ui/issues
topics:
  - rendering
  - animation
  - layout
  - physics
  - performance

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: any

flutter:
  shaders:
    - shaders/morph_sheen.frag
